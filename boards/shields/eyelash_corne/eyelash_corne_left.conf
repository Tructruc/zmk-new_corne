# Note: CONFIG_ZMK_SLEEP=y is inherited from the shared eyelash_corne.conf.

#EXT POWER
CONFIG_ZMK_EXT_POWER=y

#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# === Studio (Central only) ===
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# === Runtime Input Processor (Central only) ===
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# === Settings RPC (Central only) ===
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# === Runtime Sensor Rotate (Encoder, Central only) ===
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y

# === Settings (Central only) ===
CONFIG_SETTINGS=y

# === Battery (Central only) ===
# The POWER page plots the history, so the central records it. A 10 minute grid
# over ~16 hours, and nothing is recorded while the lead is in.
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=n
CONFIG_ZMK_BATTERY_HISTORY_INTERVAL_MINUTES=10
CONFIG_ZMK_BATTERY_HISTORY_LEVEL_THRESHOLD=2
CONFIG_ZMK_BATTERY_HISTORY_MAX_ENTRIES=96

# === Split (Central only) ===
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024
# Lets the status screen show the right half's battery and light its dot.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# === System page (Central only) ===
# Reset cause, so the SYS page can say why the last boot happened.
CONFIG_HWINFO=y

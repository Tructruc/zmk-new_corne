description: |
  Move the Beopylar status screen to another page.

  One parameter: 1 for the next page, -1 for the previous one. Bound on the FN
  layer in config/eyelash_corne.keymap through a sensor-rotate wrapper, so
  twisting the encoder walks the pages; the screen itself is implemented in
  src/status_screen.c.

compatible: "beopylar,behavior-display-page"

include: one_param.yaml
